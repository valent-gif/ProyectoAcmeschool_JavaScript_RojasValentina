<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acme-school</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/datos-json.js" defer></script>
    <script src="js/login.js" defer></script>
    <script src="js/gestion-usuarios.js" defer></script>
    <script src="js/gestion-examenes.js" defer></script>
    <script src="js/resolucion-examenes.js" defer></script>
    <script src="js/navegacion.js" defer></script>
</head>
<body>

<!--Login-->
    <main id="contenedor-vistas"></main>

    <template id="tpl-login">
    <section class="tarjeta-login">
    <h2>Iniciar Sesion - Acme School</h2>
    <form id="form-login">
    <label>
        <input type="email" id="login-email" placeholder="Correo electronico required">
    </label>

    <label>
        <input type="password" id="login-password" placeholder="Constraseña required">
    </label>

    <button type="submit">Ingresar</button>
</form>
    <p id="Login-error"></p>
    <button type="button" id="btn-vovler-publico">Volver al portal Público</button>
</section>
</template>


<!--Gestion de usuarios-->
<template id="tpl-gestion-usuarios">
    <header class="navbar-privada">
        <h2>Acme School - Gestion de Usuarios</h2>
        <nav>
        <button type="button" id="nav-usuarios">Usuarios</button>
        <button type="button" id="nav-examenes">Examenes</button>
        <button type="button" id="btn-cerrar-sesion">Cerrar Sesion</button>
    </nav>
</header>

<!-- Formulario de resgistro -->
 <section class="contenedor">
<form id="form-usuario">
    <input type="text" id="usuario-id" placeholder="identificacion (ID)" required>
    <input type="text" id="usuario-nombre" placeholder="Nombre completo" required>
    <input type="email" id="usuario-email" placeholder="Correo electronico" required>
    <input type="tel" id="usuario-telefono" placeholder="Telefono" required>
    <input type="password" id="usuario-password" placeholder="Contraseña" required>

    <select id="usuario-cargo" required>
        <option value="Seleccione un cargo..."></option>
        <option value="Administrador"></option>
        <option value="Docente"></option>
    </select>
    <button type="submit">Guardar Usuario</button>
</form>

<!--Tabla de Usuarios-->
<table>
    <thead>
        <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Telefono</th>
        <th>Cargo</th>
        <th>Acciones</th>
        </tr>
    </thead>
    <tbody id="tabla-usuarios-body"></tbody>
</table>
</section>
</template>




</body>
</html>
