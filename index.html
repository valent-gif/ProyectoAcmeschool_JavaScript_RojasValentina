<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acme-school</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/datos-json.js" defer></script>
    <script src="js/login.js" defer></script>
    <script src="js/gestion-usuarios.js" defer></script>
    <script src="js/gestion-examenes.js" defer></script>
    <script src="js/resolucion-examenes.js" defer></script>
    <script src="js/navegacion.js" defer></script>
</head>
<body>

<!--Login-->
    <main id="contenedor-vistas"></main>

    <template id="tpl-login">
    <section class="tarjeta-login">
    <h2>Iniciar Sesion - Acme School</h2>
    <form id="form-login">
    <label>
        <input type="email" id="login-email" placeholder="Correo electronico required">
    </label>

    <label>
        <input type="password" id="login-password" placeholder="Constraseña required">
    </label>

    <button type="submit">Ingresar</button>
</form>
    <p id="Login-error"></p>
    <button type="button" id="btn-vovler-publico">Volver al portal Público</button>
</section>
</template>



<!--Gestion de usuarios-->
<template id="tpl-gestion-usuarios">
    <header class="navbar-privada">
        <h2>Acme School - Gestion de Usuarios</h2>
        <nav>
        <button type="button" id="nav-usuarios">Usuarios</button>
        <button type="button" id="nav-examenes">Examenes</button>
        <button type="button" id="btn-cerrar-sesion">Cerrar Sesion</button>
    </nav>
</header>

<!-- Formulario de resgistro -->
 <section class="contenedor">
<form id="form-usuario">
    <input type="text" id="usuario-id" placeholder="identificacion (ID)" required>
    <input type="text" id="usuario-nombre" placeholder="Nombre completo" required>
    <input type="email" id="usuario-email" placeholder="Correo electronico" required>
    <input type="tel" id="usuario-telefono" placeholder="Telefono" required>
    <input type="password" id="usuario-password" placeholder="Contraseña" required>

    <select id="usuario-cargo" required>
        <option value="Seleccione un cargo..."></option>
        <option value="Administrativo">Administrativo</option>
        <option value="Docente">Docente</option>
    </select>
    <button type="submit">Guardar Usuario</button>
</form>

<!--Tabla de Usuarios-->
<table>
    <thead>
        <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Telefono</th>
        <th>Cargo</th>
        <th>Acciones</th>
        </tr>
    </thead>
    <tbody id="tabla-usuarios-body"></tbody>
</table>
</section>
</template>



<!--Gestion de examenes-->

<template id="tpl-gestion-examenes">
  <header class="navbar-privada">
    <h2>Acme School - Gestión de Exámenes</h2>
    <nav>
      <button type="button" id="nav-usuarios">Usuarios</button>
      <button type="button" id="nav-examenes">Exámenes</button>
      <button type="button" id="btn-cerrar-sesion">Cerrar sesión</button>
    </nav>
</header>

<section class="contenedor">
    <form id="form-examen">
        <h3>Datos del Examen</h3>
        <input type="text" id="examen-codigo" placeholder="Codigo (ej: EX-01)" required>
        <input type="text" id="examen-titulo" placeholder="Titulo del examen" required>
        <textarea id="examen-descripcion" placeholder="Descripcion breve" required></textarea>
        <input type="number" id="examen-tiempo" placeholder="Tiempo limite (en minutos)" min="1" required>
        <input type="number" id="examen-aprobacion" placeholder="Porcentaje de aprobacion (%)" min="1" max="100" required>
        
        <div id="bloque-preguntas">
            <h4>Agregar Preguntas</h4>
            <input type="text" id="pregunta-enunciado" placeholder="Enunciado de la pregunta">
            <input type="text" id="opcion-0" placeholder="Opción A">
            <input type="text" id="opcion-1" placeholder="Opción B">
            <input type="text" id="opcion-2" placeholder="Opción C">
            <input type="text" id="opcion-3" placeholder="Opción D">
            <select id="pregunta-correcta">
                <option value="0">Correcta: Opcion A</option>
                <option value="1">Correcta: Opcion B</option>
                <option value="2">Correcta: Opcion C</option>
                <option value="3">Correcta: Opcion D</option>
            </select>
            <button type="button" id="btn-agregar-pregunta">Añadir pregunta a la lista</button>
            <ul id="lista-preguntas-previa"></ul>
        </div>
        
        <button type="submit">Guardar Examen Completo</button>
    </form>
    
    <table>
        <thead>
            <tr>
                <th>Codigo</th>
                <th>Titulo</th>
                <th>Tiempo</th>
                <th>Aprobacion</th>
                <th>Preguntas</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-examenes-body"></tbody>
    </table>
</section>
</template>



<!--Resolucin de examenes-->

<template id="tpl-resolucion-examenes">
    <header class="navbar-publica">
    <h1>Acme School - Portal de Exámenes</h1>
    <button type="button" id="btn-ir-login">Iniciar sesión (Docentes / Admin)</button>
</header>

<section id="vista-seleccion-examen" class="contenedor">
    <div id="datos-estudiante">
      <h3>Datos del Estudiante</h3>
      <input type="text" id="estudiante-nombre" placeholder="Tu nombre completo" required>
      <input type="text" id="estudiante-id" placeholder="Tu número de identificación" required>
    </div>

    <h3>Exámenes Disponibles</h3>
    <div id="lista-examenes-publicos"></div>
</section>

<section id="vista-examen-activo" class="contenedor" hidden>
    <div class="barra-tiempo">
      <h2 id="titulo-examen-activo"></h2>
      <p>Tiempo restante: <strong id="temporizador">00:00</strong></p>
    </div>
    
    <form id="form-resolver-examen">
      <div id="contenedor-preguntas"></div>
      <button type="submit">Finalizar y Enviar Examen</button>
    </form>
</section>

<section id="vista-resultado-examen" class="contenedor" hidden>
    <h2>Resultado del Examen</h2>
    <div id="detalle-resultado"></div>
    <button type="button" id="btn-volver-inicio">Volver a la lista de exámenes</button>
</section>
</template>

</body>
</html>
